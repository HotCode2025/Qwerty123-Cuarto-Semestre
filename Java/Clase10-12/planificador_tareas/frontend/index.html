<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de tareas</title>
    <script>
        // Se aplica antes de pintar para que no haya parpadeo del tema equivocado
        try {
            const guardado = localStorage.getItem('tema');
            const sistemaOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.tema = guardado || (sistemaOscuro ? 'oscuro' : 'claro');
        } catch (error) {
            document.documentElement.dataset.tema = 'claro';
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <div class="marca">
                <span class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                        <path d="M9 4V3h6v1"></path>
                        <path d="m9 13 2 2 4-4"></path>
                    </svg>
                </span>
                <div>
                    <h1>Planificador de tareas</h1>
                    <p class="subtitulo">Organizá tu tiempo, alcanzá tus objetivos</p>
                </div>
            </div>

            <div class="selector-tema" role="group" aria-label="Tema de la interfaz">
                <button type="button" data-tema-btn="claro" aria-label="Tema claro" aria-pressed="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                    </svg>
                </button>
                <button type="button" data-tema-btn="oscuro" aria-label="Tema oscuro" aria-pressed="false">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <div class="disposicion">
        <div class="columna-principal">
        <section class="indicadores" aria-label="Resumen de tareas">
            <article class="indicador ind-total">
                <span class="indicador-icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
                </span>
                <div>
                    <p class="indicador-nombre">Total de tareas</p>
                    <p class="indicador-valor" id="indTotal">0</p>
                </div>
            </article>
            <article class="indicador ind-pendientes">
                <span class="indicador-icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                </span>
                <div>
                    <p class="indicador-nombre">Pendientes</p>
                    <p class="indicador-valor" id="indPendientes">0</p>
                </div>
            </article>
            <article class="indicador ind-completadas">
                <span class="indicador-icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>
                </span>
                <div>
                    <p class="indicador-nombre">Completadas</p>
                    <p class="indicador-valor" id="indCompletadas">0</p>
                </div>
            </article>
            <article class="indicador ind-vencidas">
                <span class="indicador-icono" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20Z"></path><path d="M12 10v4M12 17h.01"></path></svg>
                </span>
                <div>
                    <p class="indicador-nombre">Vencidas</p>
                    <p class="indicador-valor" id="indVencidas">0</p>
                </div>
            </article>
        </section>

        <form id="formTarea" class="tarjeta" novalidate>
            <h2 class="titulo-seccion">
                <span class="icono-circulo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
                </span>
                Agregar nueva tarea
            </h2>

            <div class="grilla-form">
                <label class="campo-titulo">
                    <span>Título <span class="req" aria-hidden="true">*</span></span>
                    <input type="text" id="titulo" maxlength="100" placeholder="Ej: Estudiar para el examen"
                           aria-required="true" aria-describedby="errorTitulo">
                    <span class="error" id="errorTitulo" role="alert" hidden></span>
                </label>

                <label class="campo-descripcion">
                    <span>Descripción (opcional)</span>
                    <textarea id="descripcion" maxlength="500" rows="2" placeholder="Detalles de la tarea..."></textarea>
                </label>

                <label class="campo-fecha">
                    <span>Fecha <span class="req" aria-hidden="true">*</span></span>
                    <input type="date" id="fecha" aria-required="true" aria-describedby="errorFecha">
                    <span class="error" id="errorFecha" role="alert" hidden></span>
                </label>

                <label class="campo-hora">
                    <span>Hora <span class="req" aria-hidden="true">*</span></span>
                    <input type="time" id="hora" aria-required="true" aria-describedby="errorHora">
                    <span class="error" id="errorHora" role="alert" hidden></span>
                </label>

                <label class="campo-prioridad">
                    <span>Prioridad</span>
                    <select id="prioridad">
                        <option value="ALTA">Alta</option>
                        <option value="MEDIA" selected>Media</option>
                        <option value="BAJA">Baja</option>
                    </select>
                </label>
            </div>

            <button type="submit" class="btn-primario">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                Agregar tarea
            </button>
        </form>

        <section class="tarjeta" aria-label="Filtros">
            <div class="fila filtros">
                <label>
                    <span>Estado</span>
                    <select id="filtroEstado">
                        <option value="">Todas</option>
                        <option value="false">Pendientes</option>
                        <option value="true">Finalizadas</option>
                    </select>
                </label>
                <label>
                    <span>Prioridad</span>
                    <select id="filtroPrioridad">
                        <option value="">Todas</option>
                        <option value="ALTA">Alta</option>
                        <option value="MEDIA">Media</option>
                        <option value="BAJA">Baja</option>
                    </select>
                </label>
                <p class="contador">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18l-7 9v6l-4 2v-8Z"></path></svg>
                    <span id="contador" aria-live="polite"></span>
                </p>
                <button type="button" id="btnLimpiar" class="btn-secundario">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
                    Limpiar filtros
                </button>
            </div>
        </section>

        </div>

        <section class="tarjeta tarjeta-lista" aria-labelledby="tituloLista">
            <h2 class="titulo-seccion" id="tituloLista">Tareas</h2>
            <ul id="lista" class="lista"></ul>
            <p id="vacio" class="vacio" hidden></p>
        </section>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
